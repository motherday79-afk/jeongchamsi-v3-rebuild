name: Build Jeongchamsi Minimal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Get Android source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native navigation and notification policy
        run: |
          cd android
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_back_layer.cjs
          node tests/test_startup_ready.cjs
          mkdir -p verification/classes
          javac -d verification/classes src/com/jeongchamsi/preview/{BackPolicy,StartupGate,DocumentFailure,DocumentNavigation,IntroTimeline,PushPolicy}.java tests/{BackPolicyTest,StartupTest,PushPolicyTest}.java
          java -cp verification/classes com.jeongchamsi.preview.BackPolicyTest
          java -cp verification/classes com.jeongchamsi.preview.StartupTest
          java -cp verification/classes com.jeongchamsi.preview.PushPolicyTest

      - name: Build Jeongchamsi APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          export JCS_SIGNING_FILE="$RUNNER_TEMP/jcs-signing.jks"
          trap 'rm -f "$JCS_SIGNING_FILE"' EXIT
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$JCS_SIGNING_FILE"
          else
            export SIGNING_STORE_PASSWORD="$(openssl rand -hex 24)"
            export SIGNING_KEY_PASSWORD="$SIGNING_STORE_PASSWORD"
            export SIGNING_KEY_ALIAS='jcs-preview'
            keytool -genkeypair -noprompt -keystore "$JCS_SIGNING_FILE" -storetype JKS -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_KEY_PASSWORD -alias "$SIGNING_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=JCS Private Installation Preview'
            echo '::notice::No stable signing secret: uninstall the previous private-preview APK before installing this build.'
          fi
          gradle -p android --no-daemon assembleRelease
          mkdir -p android/dist
          cp android/build/outputs/apk/release/*.apk android/dist/Jeongchamsi-1.1.345.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/dist/Jeongchamsi-1.1.345.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jeongchamsi-minimal-apk
          path: android/dist/
          if-no-files-found: error
          retention-days: 30
