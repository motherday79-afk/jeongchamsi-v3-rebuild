name: Build Jeongchamsi Minimal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Get Android source
        uses: actions/checkout@v4
        with:
          ref: android-minimal-webview

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Jeongchamsi APK
        run: bash android/tools/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jeongchamsi-minimal-apk
          path: android/dist/
          if-no-files-found: error
          retention-days: 30
