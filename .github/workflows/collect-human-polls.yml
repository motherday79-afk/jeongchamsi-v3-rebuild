name: Collect official HUMAN poll documents
on:
  workflow_dispatch:
  schedule:
    - cron: '35 7 * * 1,4,5'
permissions:
  contents: write
concurrency:
  group: human-poll-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - name: Collect and validate public reports
        run: node scripts/collect-human-polls.mjs
      - name: Publish validated snapshot to data branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('poll-output.json');
            const data = JSON.parse(content);
            if (!data.items.length) throw new Error('No validated sources; preserve published snapshot');
            const branch = 'codex/poll-data';
            const repo = context.repo;
            try { await github.rest.git.getRef({...repo, ref: 'heads/' + branch}); }
            catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: 'refs/heads/' + branch, sha: context.sha});
            }
            let sha;
            try { const old = await github.rest.repos.getContent({...repo, path: 'poll-output.json', ref: branch}); sha = old.data.sha; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...repo, branch, path: 'poll-output.json', sha, message: 'Update verified public poll snapshot', content: content.toString('base64')});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-human-polls
          path: poll-output.json
          retention-days: 7
      - name: Require all providers to report success
        run: node -e "const s=JSON.parse(require('fs').readFileSync('poll-output.json')); if(s.providers.some(p=>p.state!=='success'))process.exit(1)"
